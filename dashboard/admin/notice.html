<!doctype html>

<html>
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Notice</title>

  <link
    rel="stylesheet"
    href="./admin.css"
  >
</head>


<body>

  <header>

    <div class="tabs">

      <a
        class="tab"
        data-page="vault"
        href="./vault.html"
      >
        Vault
      </a>

      <a
        class="tab"
        data-page="transaction"
        href="./transaction.html"
      >
        Transaction
      </a>

      <a
        class="tab"
        data-page="history"
        href="./history.html"
      >
        History
      </a>

      <a
        class="tab"
        data-page="notice"
        href="./notice.html"
      >
        Notice
      </a>

    </div>


    <span data-user></span>


    <button
      class="btn"
      id="logout"
    >
      Logout
    </button>

  </header>


  <main class="wrap">

    <div class="bar">

      <h2>
        Notice
      </h2>


      <button
        id="new"
        class="btn primary"
      >
        Create Notice
      </button>

    </div>


    <div
      id="grid"
      class="grid"
    ></div>


    <div
      id="modal"
      class="modal"
    >

      <div class="box">

        <h3>
          Notice
        </h3>


        <input
          id="title"
          class="input"
          placeholder="Title"
        >


        <textarea
          id="content"
          class="input"
          placeholder="Content"
        ></textarea>


        <label>
          <input
            id="pin"
            type="checkbox"
          >
          Pinned
        </label>


        <div class="actions">

          <button
            id="save"
            class="btn primary"
          >
            Save
          </button>


          <button
            id="cancel"
            class="btn"
          >
            Cancel
          </button>

        </div>

      </div>

    </div>

  </main>


  <script type="module">

    import {
      db,
      ref,
      set,
      push,
      remove,
      onValue,
      serverTimestamp,
      me,
      $,
      esc,
      dt,
      ready,
      nav
    } from "./admin.js";


    await ready;

    nav("notice");


    let D = {};

    let E = null;

    let Rt = ref(
      db,
      `sticky_notes/${me.uid}`
    );


    function R() {

      $("grid").innerHTML =
        Object.entries(D)
          .map(([i, n]) => `
            <div class="card">

              <h3>
                ${n.pinned ? "📌 " : ""}
                ${esc(n.title || "Untitled")}
              </h3>

              <p>
                ${esc(n.content || "")}
              </p>

              <div class="muted">
                ${dt(
                  n.updatedAtMs ||
                  n.createdAtMs
                )}
              </div>

              <div class="actions">

                <button
                  class="btn edit"
                  data-id="${i}"
                >
                  Edit
                </button>

                <button
                  class="btn del"
                  data-id="${i}"
                >
                  Delete
                </button>

              </div>

            </div>
          `)
          .join("") || "<p>No notice.</p>";
    }


    onValue(
      Rt,
      s => {

        D = s.exists()
          ? s.val()
          : {};

        R();
      }
    );


    function O(n = {}, i = null) {

      E = i;

      $("title").value =
        n.title || "";

      $("content").value =
        n.content || "";

      $("pin").checked =
        !!n.pinned;

      $("modal").classList.add(
        "open"
      );
    }


    $("new").onclick = () => {
      O();
    };


    $("cancel").onclick = () => {

      $("modal").classList.remove(
        "open"
      );
    };


    $("save").onclick = async () => {

      let i =
        E ||
        push(Rt).key;


      let o =
        D[i] || {};


      let now =
        Date.now();


      await set(
        ref(
          db,
          `sticky_notes/${me.uid}/${i}`
        ),
        {
          ...o,

          title:
            $("title").value.trim(),

          content:
            $("content").value.trim(),

          pinned:
            $("pin").checked,

          createdAtMs:
            o.createdAtMs || now,

          updatedAt:
            serverTimestamp(),

          updatedAtMs:
            now
        }
      );


      $("modal").classList.remove(
        "open"
      );
    };


    document.addEventListener(
      "click",
      async e => {

        let b = e.target.closest(
          ".edit,.del"
        );


        if (!b) {
          return;
        }


        let i =
          b.dataset.id;


        if (
          b.classList.contains("edit")
        ) {

          O(
            D[i],
            i
          );

        } else if (
          confirm("Delete notice?")
        ) {

          await remove(
            ref(
              db,
              `sticky_notes/${me.uid}/${i}`
            )
          );
        }
      }
    );

  </script>

</body>
</html>
