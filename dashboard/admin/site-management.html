<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>Site Management</title>

  <link rel="stylesheet" href="./node.css">
  <link rel="stylesheet" href="./new-ui.css">
</head>

<body>

<header
  data-admin-header
  data-active-page="site-management"
></header>
  
<!-- ======================================================
     RIGHT DRAWER
     ====================================================== -->

<!-- ======================================================
     RIGHT DRAWER
     ====================================================== -->

<div id="rightDrawerOverlay" class="drawerOverlay"></div>

<aside
  id="rightDrawer"
  class="rightDrawer"
  aria-hidden="true"
>
  <div class="rightDrawerBody">

    <!-- WALLET -->
    <div class="btn-modal" id="drawerWalletRow">

      <span class="walletIcon" aria-hidden="true">
        <svg
          viewBox="0 0 24 24"
          width="16"
          height="16"
          fill="currentColor"
        >
          <path d="M5 19V5zm0 2q-.825 0-1.412-.587T3 19V5q0-.825.588-1.412T5 3h14q.825 0 1.413.588T21 5v2.5h-2V5H5v14h14v-2.5h2V19q0 .825-.587 1.413T19 21zm8-4q-.825 0-1.412-.587T11 15V9q0-.825.588-1.412T13 7h7q.825 0 1.413.588T22 9v6q0 .825-.587 1.413T20 17zm7-2V9h-7v6zm-4-1.5q.625 0 1.063-.437T17.5 12t-.437-1.062T16 10.5t-1.062.438T14.5 12t.438 1.063T16 13.5"/>
        </svg>
      </span>

      <span
        class="drawerText num"
        id="drawerWallet"
      >
        0.00
      </span>

      <span
        class="drawerSpacer"
        aria-hidden="true"
      ></span>

    </div>


    <!-- USER -->
    <div
      class="btn-user"
      id="drawerUserRow"
    >

      <span class="userIcon" aria-hidden="true">
        <svg
          viewBox="0 0 24 24"
          width="16"
          height="16"
          fill="currentColor"
        >
          <path d="M12 12a4 4 0 1 0-4-4a4 4 0 0 0 4 4zm0 2c-4.42 0-8 2.24-8 5v1h16v-1c0-2.76-3.58-5-8-5z"/>
        </svg>
      </span>

      <span
        class="drawerText"
        id="drawerUsername"
      >
        Admin
      </span>

      <span
        class="drawerSpacer"
        aria-hidden="true"
      ></span>

    </div>


    <!-- LOGOUT -->
    <button
      id="drawerLogoutBtn"
      class="userMenuItem"
      type="button"
    >

      <span class="miIcon" aria-hidden="true">
        <svg
          viewBox="0 0 24 24"
          width="18"
          height="18"
          fill="currentColor"
        >
          <path d="M3 21V3h9v2H5v14h7v2zm13-4l-1.375-1.45l2.55-2.55H9v-2h8.175l-2.55-2.55L16 7l5 5z"/>
        </svg>
      </span>

      <span class="miText">
        Logout
      </span>

      <span></span>

    </button>

  </div>
</aside>

  <main class="wrap">

    <div class="bar">

      <div>
        <h2 style="margin:0;">Site Management</h2>
        <div class="muted">
          Manage sites and Site Admin assignments.
        </div>
      </div>

      <button
        class="btn primary"
        id="btnCreateSite"
        type="button"
      >
        + Create Site
      </button>

    </div>


    <div class="card" style="margin-top:16px;">

      <div style="overflow:auto;">

        <table>

          <thead>
            <tr>
              <th>Site</th>
              <th>Site Admin</th>
              <th>Wallet / Modal</th>
              <th>Status</th>
              <th>Action</th>
            </tr>
          </thead>

          <tbody id="siteRows">

            <tr>
              <td colspan="5" class="muted">
                Loading sites...
              </td>
            </tr>

          </tbody>

        </table>

      </div>

    </div>

  </main>


<script src="./admin-access.js"></script>
<script type="module" src="./admin-core.js"></script>
<script type="module" src="./site-management.js"></script>
<script src="./new-ui.js"></script>

</body>
</html>
